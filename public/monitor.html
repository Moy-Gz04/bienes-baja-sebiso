<script>
if(!localStorage.getItem('token') || localStorage.getItem('area') !== 'Bienes'){ window.location.href = 'index.html'; }
</script>
<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monitor de existencias · SEBISO</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/fuente.css">
<link rel="stylesheet" href="css/ssidebar.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/encabezado-sistemas.css">
<link rel="stylesheet" href="css/minisebiso-flotante.css">
<link rel="stylesheet" href="css/asistente-extra.css">
<link rel="stylesheet" href="css/personal-up.css">
<link rel="stylesheet" href="css/bienes.css">
<link rel="stylesheet" href="css/monitor.css">
</head>
<body>
<div id="sidebar-container"></div>
<div class="contenido">
<section class="tv mo-monitor">
  <header class="tv-cabeza">
    <div><p class="tv-eyebrow">INVENTARIO DE BIENES</p><h1>Monitor de existencias</h1></div>
    <div class="b-cabeza-der">
      <div class="b-resumen" id="moResumen" aria-live="polite"><span><b>—</b> bienes</span><span><b>—</b> confirmados</span><span><b>—</b> por confirmar</span></div>
      <div class="mo-vivo pendiente" id="moVivo" role="status"><i aria-hidden="true"></i><span>Conectando…</span></div>
    </div>
  </header>
  <div class="mo-avance">
    <div><label for="moProgreso">Avance de confirmación</label><strong id="moPorcentaje">—</strong></div>
    <progress id="moProgreso" max="100" value="0">0%</progress>
  </div>
  <div class="b-grupos mo-grupos" id="moGrupos" role="tablist" aria-label="Clasificación"></div>
  <div class="mo-barra">
    <label class="tv-buscar"><i class="bi bi-search" aria-hidden="true"></i><input type="search" id="moBuscar" placeholder="Buscar por No. inventario, descripción o quién confirmó…" aria-label="Buscar por número de inventario, descripción o quién confirmó"></label>
    <span id="moConteo" role="status"></span>
  </div>
  <div id="moPanel" role="tabpanel" aria-labelledby="moTab0" tabindex="0">
    <div class="mo-lista">
      <table class="mo-tabla" aria-label="Existencias confirmadas">
        <thead><tr><th scope="col">Hora</th><th scope="col">No. inventario</th><th scope="col">Descripción</th><th scope="col">Clasificación</th><th scope="col">Estado físico</th><th scope="col">Confirmó</th></tr></thead>
        <tbody id="moLista"></tbody>
      </table>
      <div class="mo-vacio" id="moVacio" role="status"><i class="bi bi-box-seam" aria-hidden="true"></i><strong>Cargando confirmaciones…</strong><p>En un momento verás las existencias registradas.</p></div>
      <div class="mo-resto" id="moResto" hidden></div>
    </div>
  </div>
</section>
</div>
<script src="js/sidebar.js"></script>
<script src="js/encabezado-sistemas.js"></script>
<script src="js/monitor.js"></script>
<script src="js/minisebiso-flotante.js"></script>
<script src="js/asistente-extra.js"></script>
<script src="js/asistente-ventanas.js"></script>
</body>
</html>
