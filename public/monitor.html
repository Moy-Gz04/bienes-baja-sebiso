<script>
if(!localStorage.getItem('token') || localStorage.getItem('area') !== 'Bienes'){ window.location.href = 'index.html'; }
</script>
<!DOCTYPE html>
<html lang="es">
<head>
<link rel="icon" href="favicon.ico">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Monitor de existencias · SEBISO</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/fuente.css">
<link rel="stylesheet" href="css/ssidebar.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="css/encabezado-sistemas.css">
<link rel="stylesheet" href="css/bienes.css">
<style>
.mo-vivo{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; color:var(--txt2); }
.mo-vivo i{ width:9px; height:9px; border-radius:50%; background:#2F6B4F; animation:mo-p 1.6s infinite; }
.mo-vivo.off i{ background:#9B1C31; animation:none; }
@keyframes mo-p{ 50%{ opacity:.25 } }
.mo-grupos{ grid-template-columns:repeat(4,minmax(0,1fr)); }
.mo-lista{ background:#fff; border:1.5px solid var(--borde); border-radius:14px; overflow:hidden; }
.mo-fila{ display:grid; grid-template-columns:150px 90px minmax(0,1fr) 190px 150px; gap:10px; align-items:center; padding:10px 14px; border-top:1px solid var(--borde); font-size:13px; }
.mo-fila:first-child{ border-top:0; }
.mo-cab{ background:#5b1e2e; color:#fff; font-weight:700; font-size:12px; }
.mo-fila.nueva{ animation:mo-n 3s ease-out; }
@keyframes mo-n{ from{ background:#FBF0DC } to{ background:transparent } }
.mo-fila small{ color:var(--txt2); display:block; }
.mo-vacio{ padding:26px; text-align:center; color:var(--txt2); }
.mo-resto{ padding:10px; text-align:center; color:var(--txt2); font-size:12px; }
</style>
</head>
<body>
<div id="sidebar-container"></div>
<div class="contenido">
<section class="tv">
  <header class="tv-cabeza">
    <div><p class="tv-eyebrow">Inventario de bienes</p><h1>Monitor de existencias confirmadas</h1></div>
    <div class="b-cabeza-der"><div class="b-resumen" id="moResumen" aria-live="polite"></div><span class="mo-vivo" id="moVivo"><i></i><span>En vivo</span></span></div>
  </header>
  <div class="b-grupos mo-grupos" id="moGrupos" role="tablist" aria-label="Clasificación"></div>
  <div class="mo-lista" id="moLista"></div>
</section>
</div>
<script src="js/sidebar.js"></script>
<script src="js/encabezado-sistemas.js"></script>
<script src="js/monitor.js"></script>
</body>
</html>
