# Front en Netlify (solo la carpeta public, sin los PDF: esos viven en Drive).
# /api/* se reenvía al servidor de Render, así el front y la API quedan en el mismo dominio.
[build]
  publish = "public"

[[redirects]]
  from = "/api/*"
  to = "https://bienes-baja-sebiso.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/f/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"
